name: CI

on:
  pull_request:
    branches: [deploy]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci # som npm install, men exakt enligt package-lock
      - run: npm run lint
      - run: npm run build # tsc -b + vite build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # samma som i pom.xml
          cache: maven
      - run: ./mvnw -B verify # kompilerar + kör testerna

  docker:
    needs: backend # körs bara om backend-jobbet gick igenom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bokningssystem-backend backend
